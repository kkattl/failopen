---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: saas-tenant-acme
  labels: &id001
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: formcraft
    formcraft.io/tenant: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: general
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - secretRef:
            name: db-credentials
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - formcraft
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - formcraft
          periodSeconds: 10
          initialDelaySeconds: 20
      terminationGracePeriodSeconds: 10
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 512Mi
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  serviceName: db

