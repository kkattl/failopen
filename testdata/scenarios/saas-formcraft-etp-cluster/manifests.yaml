---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: saas-edge
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: formcraft
data:
  nginx.conf: "pid /tmp/nginx.pid;\nworker_processes 1;\nevents { worker_connections 1024; }\nhttp {\n  client_body_temp_path /tmp/client_temp;\n  proxy_temp_path /tmp/proxy_temp;\n  fastcgi_temp_path /tmp/fastcgi_temp;\n\
    \  uwsgi_temp_path /tmp/uwsgi_temp;\n  scgi_temp_path /tmp/scgi_temp;\n  access_log /dev/stdout;\n  error_log /dev/stderr warn;\n  server_tokens off;\n  # Re-resolve tenant Services at request time\
    \ so the gateway starts even if a tenant is down.\n  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;\n  # Unknown Host -> 404. Never fall through to a tenant.\n  server {\n    listen\
    \ 8080 default_server;\n    location = /healthz { access_log off; return 200 \"ok\\n\"; }\n    location / { return 404; }\n  }\n  server {\n    listen 8080;\n    server_name acme.formcraft.example;\n\
    \    location / {\n      set $upstream http://app.saas-tenant-acme.svc.cluster.local:8080;\n      proxy_pass $upstream;\n      proxy_set_header Host $host;\n      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \      proxy_set_header X-Formcraft-Tenant acme;\n    }\n  }\n  server {\n    listen 8080;\n    server_name globex.formcraft.example;\n    location / {\n      set $upstream http://app.saas-tenant-globex.svc.cluster.local:8080;\n\
    \      proxy_pass $upstream;\n      proxy_set_header Host $host;\n      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n      proxy_set_header X-Formcraft-Tenant globex;\n    }\n  }\n\
    \  server {\n    listen 8080;\n    server_name initech.formcraft.example;\n    location / {\n      set $upstream http://app.saas-tenant-initech.svc.cluster.local:8080;\n      proxy_pass $upstream;\n\
    \      proxy_set_header Host $host;\n      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n      proxy_set_header X-Formcraft-Tenant initech;\n    }\n  }\n}\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: saas-edge
  labels: &id001
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: formcraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: edge
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          initialDelaySeconds: 5
      terminationGracePeriodSeconds: 10
      tolerations:
      - key: dedicated
        operator: Equal
        value: edge
        effect: NoSchedule
      volumes:
      - name: config
        configMap:
          name: gateway-config
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: saas-edge
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: formcraft
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 31480
    protocol: TCP
  type: NodePort
  externalTrafficPolicy: Cluster   # MUTATION: was Local

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: saas-edge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: saas-edge
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-from-outside-cluster
  namespace: saas-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 192.168.0.0/16
    ports:
    - protocol: TCP
      port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-to-tenant-apps
  namespace: saas-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - saas-tenant-acme
          - saas-tenant-globex
          - saas-tenant-initech
      podSelector:
        matchLabels:
          app.kubernetes.io/name: app
    ports:
    - protocol: TCP
      port: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: saas-platform
  labels: &id001
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: formcraft
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: general
      containers:
      - name: auth
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args:
        - netexec
        - --http-port=8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          initialDelaySeconds: 5
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: auth
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: auth

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: saas-platform
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: formcraft
spec:
