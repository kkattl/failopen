apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
# Default-deny: nothing may talk to pods in this namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payments
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The "protected" service the policy is supposed to isolate.
apiVersion: v1
kind: Pod
metadata:
  name: api-server
  namespace: payments
  labels:
    app: api-server
spec:
  containers:
    - name: app
      # agnhost netexec actually listens on :80, so reachability can be
      # verified with curl (pause listens on nothing).
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=80"]
      ports:
        - containerPort: 80
---
# HOLE #1: hostNetwork pod — lives on the node's network,
# so the NetworkPolicy above simply does not apply to it.
apiVersion: v1
kind: Pod
metadata:
  name: host-probe
  namespace: payments
  labels:
    app: host-probe
spec:
  hostNetwork: true
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
---
# NOT a hole on Calico (verified by `make verify`): NodePort traffic is
# DNAT'd to the pod IP and default-deny-all still blocks it. It stays in the
# scenario as a WARNING case: exposed on every node, enforcement is
# CNI-dependent, and SNAT hides the client IP from ipBlock rules.
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: payments
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31080
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# HOLE #2: hostNetwork pod in ANOTHER namespace, co-located with a
# payments pod. Calico allows node -> local-workload traffic (so kubelet
# probes work), and a hostNetwork pod IS the node — so it reaches
# api-server despite default-deny-all. Looks like a harmless node agent.
apiVersion: v1
kind: Pod
metadata:
  name: node-agent
  namespace: monitoring
spec:
  hostNetwork: true
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: api-server
          namespaces: ["payments"]
          topologyKey: kubernetes.io/hostname
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
