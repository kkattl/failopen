spec:
  selector: {app: ledger}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: fintech-cde
type: Opaque
stringData:
  password: lab-only-change-me-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fintech-cde
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {pool: restricted}
      tolerations:
        - {key: dedicated, operator: Equal, value: restricted, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: ledger}
            - {name: POSTGRES_DB, value: ledger}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ledger", "-d", "ledger", "-h", "127.0.0.1"]}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: postgres}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fintech-cde
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]

########################################################################
# fintech-ops : node agent (every node) + prometheus
########################################################################
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: fintech-ops
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     warn
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Parsers_File  /fluent-bit/etc/parsers.conf
        storage.path  /buffer
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        DB                /buffer/tail.db
        storage.type      filesystem
    [FILTER]
        Name    record_modifier
        Match   *
        Record  node ${NODE_NAME}
        Record  cluster paylane-lab
    [OUTPUT]
        # Log vendor endpoint (placeholder hostname; replace with the real vendor intake).
        Name         http
        Match        *
        Host         logs.log-vendor.example
        Port         443
        URI          /v1/ingest
        Format       json_lines
        tls          On
        tls.verify   On
        Header       Authorization Bearer ${LOG_VENDOR_TOKEN}
        Retry_Limit  5
---
apiVersion: v1
kind: Secret
metadata:
  name: log-vendor
  namespace: fintech-ops
type: Opaque
stringData:
  token: lab-only-placeholder-token
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: fintech-ops
  labels: {app: node-agent}
spec:
  selector:
    matchLabels: {app: node-agent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Deliberately NOT hostNetwork: host-network pods are outside NetworkPolicy
      # enforcement and would share the node's network identity on CDE nodes.
      tolerations:
        - operator: Exists   # every node: general, edge, restricted, control-plane
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/.+|run/containerd/.+)($|/)
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer}
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.2
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: LOG_VENDOR_TOKEN
              valueFrom: {secretKeyRef: {name: log-vendor, key: token}}
          ports: [{name: fb-http, containerPort: 2020}]
          readinessProbe:
            httpGet: {path: /, port: fb-http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            runAsUser: 0          # container log files on the node are root-owned
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: buffer, mountPath: /buffer}
      volumes:
        - name: proc
          hostPath: {path: /proc, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: root
          hostPath: {path: /, type: Directory}
        - name: varlog
          hostPath: {path: /var/log, type: Directory}
        - name: config
          configMap: {name: fluent-bit-config}
        - name: buffer
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: node-agent
  namespace: fintech-ops
spec:
  clusterIP: None   # headless: prometheus discovers every node agent via DNS A records
  selector: {app: node-agent}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fintech-ops
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: node
        dns_sd_configs:
          - names: [node-agent.fintech-ops.svc.cluster.local]
            type: A
            port: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fintech-ops
  labels: {app: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {pool: general}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports: [{name: web, containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 512Mi}

