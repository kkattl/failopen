# =====================================================================
# health-reporting: streaming replica of records-db (still PHI -> restricted
# pool) and the nightly de-identification CronJob.
# =====================================================================
---
apiVersion: v1
kind: Secret
metadata: {name: reporting-replica, namespace: health-reporting}
type: Opaque
stringData:
  REPLICATION_PASSWORD: lab-repl-2b9d44
---
apiVersion: v1
kind: Secret
metadata: {name: reporting-job, namespace: health-reporting}
type: Opaque
stringData:
  PGPASSWORD: lab-report-91aa0c
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: reporting-replica, namespace: health-reporting}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reporting-replica
  namespace: health-reporting
  labels: {app.kubernetes.io/name: reporting-replica, app.kubernetes.io/part-of: carewell, carewell.io/data-class: phi}
spec:
  serviceName: reporting-replica
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector: {matchLabels: {app.kubernetes.io/name: reporting-replica}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reporting-replica, app.kubernetes.io/part-of: carewell, carewell.io/data-class: phi}
    spec:
      serviceAccountName: reporting-replica
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {pool: restricted}
      tolerations: [{key: dedicated, operator: Equal, value: restricted, effect: NoSchedule}]
      # keep the replica off the primary's node/zone
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: health-phi}}
                labelSelector: {matchLabels: {app.kubernetes.io/name: records-db}}
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                until PGPASSWORD="$REPLICATION_PASSWORD" pg_basebackup \
                    -h records-db.health-phi.svc.cluster.local -U replicator \
                    -D "$PGDATA" -R -X stream; do
                  echo "base backup failed, retrying"; rm -rf "$PGDATA"; sleep 5
                done
                chmod 0700 "$PGDATA"
              fi
              exec postgres -c hot_standby=on
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: REPLICATION_PASSWORD, valueFrom: {secretKeyRef: {name: reporting-replica, key: REPLICATION_PASSWORD}}}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, reporting, -d, records]}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data, labels: {carewell.io/data-class: phi}}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: reporting-replica, namespace: health-reporting, labels: {app.kubernetes.io/name: reporting-replica}}
spec:
  selector: {app.kubernetes.io/name: reporting-replica}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: reporting-replica, namespace: health-reporting}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reporting-replica}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: reporting}}
      ports: [{protocol: TCP, port: 5432}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: health-phi}}
          podSelector: {matchLabels: {app.kubernetes.io/name: records-db}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: reporting, namespace: health-reporting}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reporting
  namespace: health-reporting
  labels: {app.kubernetes.io/name: reporting, app.kubernetes.io/part-of: carewell}
spec:
  schedule: "15 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: reporting, app.kubernetes.io/part-of: carewell}
        spec:
          restartPolicy: Never
          serviceAccountName: reporting
          automountServiceAccountToken: false
          enableServiceLinks: false
          # processes PHI (before de-identification) -> restricted pool
          nodeSelector: {pool: restricted}
          tolerations: [{key: dedicated, operator: Equal, value: restricted, effect: NoSchedule}]
          securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: reporting
              image: docker.io/library/postgres:17-alpine
              # stand-in for the de-identification batch: read-only query on the replica
              command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "reporting-replica.health-reporting.svc.cluster.local",
                        "-U", "reporting", "-d", "records", "-tAc",
                        "select 'replica_in_recovery=' || pg_is_in_recovery() || ' tables=' || count(*) from pg_catalog.pg_tables"]
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: reporting-job, key: PGPASSWORD}}}
                - {name: PGCONNECT_TIMEOUT, value: "5"}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: reporting, namespace: health-reporting}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reporting}}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: reporting-replica}}
      ports: [{protocol: TCP, port: 5432}]

# =====================================================================
# health-ops: node agents
# =====================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: log-shipper, namespace: health-ops}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: log-shipper, namespace: health-ops}
data:
  # SIEM collector address is a placeholder (TEST-NET-3); set the real one.
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     warn
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.path  /buffers/
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  cri
        DB                /buffers/tail.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        storage.type      filesystem
    [INPUT]
        Name              systemd
        Tag               node.*
        # kind/most nodes keep a volatile journal in /run/log/journal
        Path              /run/log/journal
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Systemd_Filter    _SYSTEMD_UNIT=containerd.service
        Read_From_Tail    On
        DB                /buffers/journal.db
    [FILTER]
        Name    record_modifier
        Match   *
        Record  node ${NODE_NAME}
        Record  cluster carewell-lab
    [OUTPUT]
        Name          forward
        Match         *
        Host          203.0.113.10
        Port          24224
        tls           On
        tls.verify    On
        Retry_Limit   False
        storage.total_limit_size 256M
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: health-ops
  labels: {app.kubernetes.io/name: log-shipper, app.kubernetes.io/part-of: carewell}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: log-shipper}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: log-shipper, app.kubernetes.io/part-of: carewell}
    spec:
      serviceAccountName: log-shipper
      automountServiceAccountToken: false
      enableServiceLinks: false
      # EVERY node: general, edge, restricted and the control plane.
      tolerations:
        - {operator: Exists}
      securityContext:
        runAsUser: 0          # container log files are root-owned 0640
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluent-bit
          image: docker.io/fluent/fluent-bit:3.2
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          ports: [{name: metrics, containerPort: 2020}]
          readinessProbe: {httpGet: {path: /, port: metrics}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: metrics}, periodSeconds: 20, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc, readOnly: true}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: machine-id, mountPath: /etc/machine-id, readOnly: true}
            - {name: journal, mountPath: /run/log/journal, readOnly: true}
            - {name: buffers, mountPath: /buffers}
      volumes:
        - {name: config, configMap: {name: log-shipper}}
        - {name: varlog, hostPath: {path: /var/log, type: Directory}}
        - {name: machine-id, hostPath: {path: /etc/machine-id, type: File}}
        - {name: journal, hostPath: {path: /run/log/journal, type: Directory}}
        - {name: buffers, emptyDir: {sizeLimit: 300Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: log-shipper, namespace: health-ops}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: log-shipper}}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock: {cidr: 203.0.113.10/32}   # SIEM collector (placeholder)
      ports: [{protocol: TCP, port: 24224}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backup-agent, namespace: health-ops}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: backup-agent
  namespace: health-ops
  labels: {app.kubernetes.io/name: backup-agent, app.kubernetes.io/part-of: carewell}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: backup-agent}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backup-agent, app.kubernetes.io/part-of: carewell}
    spec:
      serviceAccountName: backup-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      # All persistent volumes of this platform live on pool=restricted
      # (every stateful workload is pinned there), so that pool == "nodes that store data".
      nodeSelector: {pool: restricted}
      tolerations: [{key: dedicated, operator: Equal, value: restricted, effect: NoSchedule}]
      securityContext:
        runAsUser: 0          # must read postgres (uid 70, 0700) data dirs
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: registry.k8s.io/e2e-test-images/agnhost:2.53   # stand-in for the vendor agent
          args: ["pause"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
          volumeMounts:
            - {name: volumes, mountPath: /backup-source, readOnly: true}
      volumes:
        - {name: volumes, hostPath: {path: /var/local-path-provisioner, type: DirectoryOrCreate}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: backup-agent, namespace: health-ops}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: backup-agent}}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock: {cidr: 198.51.100.0/24}   # backup vendor endpoint (placeholder)
      ports: [{protocol: TCP, port: 443}]
