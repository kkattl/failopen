apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: ecom-shared
  labels: {app: session-cache, northwind.io/team: platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: session-cache}
  template:
    metadata:
      labels: {app: session-cache, northwind.io/team: platform}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {pool: general}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 48mb --maxmemory-policy allkeys-lru"]
        envFrom: [{secretRef: {name: session-cache-credentials}}]
        ports: [{name: redis, containerPort: 6379}]
        readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 5}
        livenessProbe: {tcpSocket: {port: redis}, periodSeconds: 10}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 96Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - {name: data, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: session-cache, namespace: ecom-shared}
spec:
  selector: {app: session-cache}
  ports: [{name: redis, port: 6379, targetPort: redis}]
