    northwind.io/team: orders
    northwind.io/compliance: pci
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecom-shared
  labels:
    app.kubernetes.io/part-of: northwind-store
    northwind.io/team: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
