# ===========================================================================
# NetworkPolicy
# Pattern per namespace: default-deny all ingress+egress, allow DNS egress,
# then one ingress policy per destination and one egress policy per source.
# A flow works only if BOTH the source's egress and the destination's ingress
# allow it, so each team controls who may call it.
# ===========================================================================
# ---- baseline: default deny + DNS, for every namespace ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: ecom-edge}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
