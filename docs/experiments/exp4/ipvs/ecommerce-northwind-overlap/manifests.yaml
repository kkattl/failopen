# ===========================================================================
# ecom-edge : edge-proxy
# F5 -> <edge node IP>:30080 (NodePort, externalTrafficPolicy=Local) -> nginx
# on the edge pool -> web / bff ClusterIP services.
# ===========================================================================
apiVersion: v1
kind: ConfigMap
metadata: {name: edge-proxy-config, namespace: ecom-edge}
data:
  default.conf: |
    # TLS is terminated on the F5 in this lab; in production re-encrypt to here.
    server {
      listen 8080;
      server_name _;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location /api/ {
        proxy_pass http://bff.ecom-storefront.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
      }
      location / {
        proxy_pass http://web.ecom-storefront.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-proxy
  namespace: ecom-edge
  labels: {app: edge-proxy, northwind.io/team: platform}
spec:
  selector:
    matchLabels: {app: edge-proxy}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # no gap on the single edge node
  template:
    metadata:
      labels: {app: edge-proxy, northwind.io/team: platform}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {pool: edge}
      tolerations:
      - {key: dedicated, operator: Equal, value: edge, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: conf
        configMap: {name: edge-proxy-config}
      - name: tmp
        emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-proxy
  namespace: ecom-edge
  annotations:
    northwind.io/f5-pool: "edge node IPs, port 30080"
spec:
  type: NodePort
  # Local: only nodes that run an edge-proxy pod (the edge pool) answer on 30080,
  # no second hop to another node, and the F5 source IP is preserved so the
  # NetworkPolicy below can pin ingress to the F5 network.
  externalTrafficPolicy: Local
  selector: {app: edge-proxy}
  ports:
  - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
# ===========================================================================
# ecom-storefront : web, bff
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecom-storefront
  labels: {app: web, northwind.io/team: storefront}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, northwind.io/team: storefront}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {pool: general}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: web}}}
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: app
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{name: http, containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: ecom-storefront}
spec:
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: ecom-storefront}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: web}
