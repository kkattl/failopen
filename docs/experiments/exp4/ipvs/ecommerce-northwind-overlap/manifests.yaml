    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: catalog-db-ingress, namespace: ecom-catalog}
spec:
  podSelector: {matchLabels: {app: catalog-db}}
  policyTypes: [Ingress]
  ingress:
  - from:   # owning team only
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [catalog-api, search]}]}
    ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: catalog-api-egress, namespace: ecom-catalog}
spec:
  podSelector: {matchLabels: {app: catalog-api}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: search}}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - podSelector: {matchLabels: {app: catalog-db}}
    ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: search-egress, namespace: ecom-catalog}
spec:
  podSelector: {matchLabels: {app: search}}
  policyTypes: [Egress]
  egress:
  - to:   # indexer reads the catalog
    - podSelector: {matchLabels: {app: catalog-db}}
    ports: [{protocol: TCP, port: 5432}]
---
