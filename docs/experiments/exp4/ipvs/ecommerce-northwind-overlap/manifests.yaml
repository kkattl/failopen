# Northwind Retail - online store (lab)
# Namespaces (one per owning team + platform-owned edge + shared cache):
#   ecom-edge        platform team : edge-proxy (nginx) - the only thing the F5 talks to
#   ecom-storefront  storefront    : web, bff
#   ecom-catalog     catalog       : catalog-api, search, catalog-db
#   ecom-orders      orders        : cart, checkout (PCI), orders-db (PCI)
#   ecom-shared      platform team : session-cache (redis)
# See README.md for the flow matrix. Every namespace is default-deny (ingress+egress).
# ---------------------------------------------------------------------------
# Namespaces
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ecom-edge
  labels:
    app.kubernetes.io/part-of: northwind-store
    northwind.io/team: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecom-storefront
  labels:
    app.kubernetes.io/part-of: northwind-store
    northwind.io/team: storefront
