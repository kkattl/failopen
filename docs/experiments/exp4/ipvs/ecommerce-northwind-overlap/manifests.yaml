apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: ecom-catalog
  labels: {app: catalog-db, northwind.io/team: catalog}
spec:
  serviceName: catalog-db
  replicas: 1
  selector:
    matchLabels: {app: catalog-db}
  template:
    metadata:
      labels: {app: catalog-db, northwind.io/team: catalog}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {pool: general}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: postgres
        image: postgres:17-alpine
        envFrom: [{secretRef: {name: catalog-db-credentials}}]
        env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
        ports: [{name: postgres, containerPort: 5432}]
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]}
          periodSeconds: 5
        livenessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 20, periodSeconds: 10}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
      volumes:
      # LAB COMPROMISE: emptyDir. Production = volumeClaimTemplates on a
      # replicated storage class (or a managed Postgres) + backups.
      - {name: data, emptyDir: {sizeLimit: 1Gi}}
      - {name: run, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-db, namespace: ecom-catalog}
spec:
  selector: {app: catalog-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
