# ---- ecom-edge ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-proxy-ingress-from-f5, namespace: ecom-edge}
spec:
  podSelector: {matchLabels: {app: edge-proxy}}
  policyTypes: [Ingress]
  ingress:
  - from:
    # F5 self-IP / SNAT network. In this kind lab the "F5" is the docker
    # bridge 172.18.0.0/16; replace with the real F5 SNAT pool CIDR.
    - ipBlock: {cidr: 172.18.0.0/16}   # MUTATION: original value, overlaps the node network
    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-proxy-egress, namespace: ecom-edge}
spec:
  podSelector: {matchLabels: {app: edge-proxy}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-storefront}}
      podSelector: {matchExpressions: [{key: app, operator: In, values: [web, bff]}]}
    ports: [{protocol: TCP, port: 8080}]
---
# ---- ecom-storefront ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-ingress, namespace: ecom-storefront}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-edge}}
      podSelector: {matchLabels: {app: edge-proxy}}
    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bff-ingress, namespace: ecom-storefront}
spec:
  podSelector: {matchLabels: {app: bff}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-edge}}
      podSelector: {matchLabels: {app: edge-proxy}}
    - podSelector: {matchLabels: {app: web}}
    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-egress, namespace: ecom-storefront}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: bff}}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-shared}}
      podSelector: {matchLabels: {app: session-cache}}
    ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bff-egress, namespace: ecom-storefront}
spec:
  podSelector: {matchLabels: {app: bff}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-catalog}}
      podSelector: {matchLabels: {app: catalog-api}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-orders}}
      podSelector: {matchExpressions: [{key: app, operator: In, values: [cart, checkout]}]}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ecom-shared}}
      podSelector: {matchLabels: {app: session-cache}}
    ports: [{protocol: TCP, port: 6379}]
---
# ---- ecom-catalog ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: catalog-api-ingress, namespace: ecom-catalog}
