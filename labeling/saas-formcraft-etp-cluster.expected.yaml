    evidence: []
  - id: f8
    class: other
    subject: {kind: NetworkPolicy, namespace: saas-platform, name: mailer-egress-to-external-smtp, port: 25}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    agreed_by: [network, skeptic]
    rationale: >
      SMTP egress to 0.0.0.0/0 minus private/CGNAT/link-local/loopback on 25/465/587 cannot
      reach pods, nodes or the lab external network; evaluated before SNAT. Intentional.
    evidence: []
  - id: f9
    class: other
    subject: {kind: NetworkPolicy, namespace: saas-platform, name: billing-egress-to-tenant-apps}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    agreed_by: [skeptic]
    rationale: >
      billing -> every tenant app:8080 is a documented cross-tenant flow (flow 7), mirrored by
      each tenant's app-ingress. Not a tenant-isolation break. (Single-labeller negative,
      kept.)
    evidence: []
  - id: f10
    class: node-exception-segment
    subject: {kind: Workload, namespace: kube-system, name: kube-proxy}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    agreed_by: [skeptic]
    rationale: >
      kube-proxy, the CNI agent and other kube-system hostNetwork DaemonSets run on every
      node, including the general nodes of the saas-tenant-* namespaces. The spec always
      allows node-local traffic (kubelet probes) and these are cluster infrastructure; the
      class targets NON-system hostNetwork pods. (Single-labeller negative, kept: consistent
      with the class definition in labeling/README.md. Subject is not in the scenario
      inventory; see cross-cutting question.)
    evidence: []
  - id: f11
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    agreed_by: [network, auditor, skeptic]
    rationale: >
      NetworkPolicies exist but flannel has no policy engine; the API server accepts them
      anyway (docs: posting a NetworkPolicy has no effect unless the network plugin supports
      it). Every declared deny is open.
    evidence: []
  - id: f12
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
