scenario: saas-formcraft-etp-cluster
labeler: consensus(network,auditor,skeptic)
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    agreed_by: [network, auditor, skeptic]
    rationale: >
      The ipBlock 0.0.0.0/0 except the pod CIDR admits node IPs, and with
      externalTrafficPolicy Cluster kube-proxy masquerades NodePort traffic to a node address
      on every node (including a pod's own node, where DNAT+MASQ happen before natOutgoing),
      in addition to the natOutgoing path of the base scenario. Any pod with open egress
      reaching any node's :31480 arrives from a node IP and passes the rule meant to exclude
      pods (README row 1). Tenant pods are still stopped by their own egress policies, hence
      warning.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    agreed_by: [network, auditor, skeptic]
    rationale: >
      Different mechanism than Calico: traffic entering on the edge node (where the gateway
      runs) is masqueraded to a local host address and, with policy enforced at the endpoint
      after POSTROUTING, Cilium classifies it as reserved:host, allowed by default. Pods could
      then reach the gateway via <edge IP>:31480 regardless of the ipBlock; traffic forwarded
      from other nodes arrives as remote-node and is denied. Unlike the ETP Local original,
      where Cilium is expected to deny. Settle by measurement.
    evidence: []
  - id: f3
    class: other
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico, cilium]
    label: may
    severity: warning
    agreed_by: [network, auditor, skeptic]
    rationale: >
      Design drift: the design relies on ETP Local ('only the edge node answers', 'the client
      source IP is kept, which the ingress policy depends on'). With Cluster every general and
      restricted node forwards :31480 and the client IP is lost, so the source-IP policy can
      no longer tell real external clients from SNAT'd in-cluster ones. Side effects are
      overblocks: on Calico IPIP an external client entering via a non-edge node may arrive
      with the tunl0 address (pod CIDR) and hit the except; on Cilium it arrives as remote-
      node and is not matched by the CIDR rule. May be folded into the ipblock finding.
    evidence: []
  - id: f4
    class: other
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [flannel]
    label: may
    severity: info
    agreed_by: [network]
    rationale: >
      Same design drift on flannel: every node forwards :31480 (served, no policy). Mostly
      subsumed by cni-not-enforcing. (Only network's [any] scope covers flannel; kept as may.)
    evidence: []
  - id: f5
    class: node-exception-segment
    subject: {kind: Namespace, namespace: saas-tenant-acme, name: saas-tenant-acme}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    agreed_by: [network, auditor, skeptic]
    rationale: >
      No hostNetwork workloads and no DaemonSets; tenants share general nodes only with each
      other's pod-network pods and system components. (All three labellers wrote this for acme
      with 'same for globex and initech'; split per tenant by the adjudicator.)
    evidence: []
