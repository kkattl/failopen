scenario: saas-formcraft-etp-cluster
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: other
  subject:
    kind: NetworkPolicy
    namespace: saas-platform
    name: mailer-egress-to-external-smtp
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: 'SMTP egress to 0.0.0.0/0 minus private/CGNAT/link-local/loopback: excludes pods
    and nodes; evaluated before SNAT. Intended.'
  evidence: []
- id: f4
  class: other
  subject:
    kind: NetworkPolicy
    namespace: saas-platform
    name: billing-egress-to-tenant-apps
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: billing -> every tenant app:8080 is a documented, intended cross-tenant flow
    (flow 7), mirrored by each tenant's app-ingress. Not a tenant-isolation break.
  evidence: []
- id: f5
  class: node-exception-segment
  subject:
    kind: Namespace
    name: saas-tenant-acme
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: No hostNetwork workloads in the scenario; tenants share general nodes only with
    each other (pod network, policy-enforced) and kube-system. Same for globex and initech.
  evidence: []
- id: f6
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of the saas-tenant-* namespaces. The
    spec always allows node-local traffic (kubelet probes depend on it) and these are cluster
    infrastructure the app team cannot and should not remove. Flagging them is noise; the
    class is about NON-system hostNetwork pods.
  evidence: []
- id: f7
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: snat
  applies_to_cni:
  - calico
  label: must
  severity: warning
  rationale: With externalTrafficPolicy=Cluster kube-proxy masquerades NodePort traffic to
    the node IP on every node, including the pod's own node (dst is local, so DNAT+MASQ happens
    before natOutgoing). Any pod that can reach any node IP on 31480 arrives at the gateway
    from a node IP, which '0.0.0.0/0 except 192.168.0.0/16' admits. The ipBlock's pod exclusion
    is void, and it can no longer tell external clients from anything else.
  evidence: []
- id: f8
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: node-local
  applies_to_cni:
  - cilium
  label: may
  severity: warning
  rationale: 'Uncertain: on Cilium the ipBlock does not match node IPs, but traffic entering
    on the edge node (where the gateway runs) is masqueraded to a local host address and Cilium
    allows reserved:host by default. Pods could then reach the gateway via <edge-node-IP>:31480
    regardless of the ipBlock. Real if the oracle shows it; different mechanism than Calico.'
  evidence: []
- id: f9
  class: other
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: snat
  applies_to_cni:
  - cilium
  label: may
  severity: info
  rationale: 'Overblock: external clients hitting a non-edge node are forwarded with kube-proxy
    SNAT to that node''s IP; Cilium sees remote-node, which a CIDR rule does not match, so
    declared allow flow 1 fails except via the edge node. Worth knowing, not a security issue.'
  evidence: []
- id: f10
  class: other
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: snat
  applies_to_cni:
  - calico
  label: may
  severity: info
  rationale: 'Design drift rather than policy divergence: the README relies on ''only the
    edge node answers on 31480'' and on the preserved client IP; with eTP=Cluster every general
    and restricted node forwards 31480 to the gateway. The NetworkPolicy itself does not forbid
    that, hence may.'
  evidence: []
