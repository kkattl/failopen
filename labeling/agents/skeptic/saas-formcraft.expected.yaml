scenario: saas-formcraft
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: other
  subject:
    kind: NetworkPolicy
    namespace: saas-platform
    name: mailer-egress-to-external-smtp
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: 'SMTP egress to 0.0.0.0/0 minus private/CGNAT/link-local/loopback: excludes pods
    and nodes; evaluated before SNAT. Intended.'
  evidence: []
- id: f4
  class: other
  subject:
    kind: NetworkPolicy
    namespace: saas-platform
    name: billing-egress-to-tenant-apps
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: billing -> every tenant app:8080 is a documented, intended cross-tenant flow
    (flow 7), mirrored by each tenant's app-ingress. Not a tenant-isolation break.
  evidence: []
- id: f5
  class: node-exception-segment
  subject:
    kind: Namespace
    name: saas-tenant-acme
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: No hostNetwork workloads in the scenario; tenants share general nodes only with
    each other (pod network, policy-enforced) and kube-system. Same for globex and initech.
  evidence: []
- id: f6
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of the saas-tenant-* namespaces. The
    spec always allows node-local traffic (kubelet probes depend on it) and these are cluster
    infrastructure the app team cannot and should not remove. Flagging them is noise; the
    class is about NON-system hostNetwork pods.
  evidence: []
- id: f7
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: snat
  applies_to_cni:
  - calico
  label: must
  severity: warning
  rationale: 'gateway ingress: 0.0.0.0/0 except 192.168.0.0/16, explicitly so ''no pod can
    use the gateway to hop into a tenant'' (flow 1). NodePort 31480 is eTP=Local on the edge
    node. A pod connecting to <edge-node-IP>:31480 is SNAT''d by Calico natOutgoing to its
    node IP, which the ipBlock admits, and the gateway routes by Host header to any tenant.
    Tenant pods themselves are egress-locked, so the realised exposure is pods of other namespaces
    and host processes; still a false claim in the design, cheap to fix (an LB-specific CIDR).'
  evidence: []
- id: f8
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: snat
  applies_to_cni:
  - cilium
  label: must-not
  rationale: Cilium CIDR rules match world only; SNAT'd pod traffic is remote-node or keeps
    its pod identity; not admitted. eTP=Local keeps the external client IP, so the intended
    flow works.
  evidence: []
- id: f9
  class: cilium-ipblock-cluster-addrs
  subject:
    kind: NetworkPolicy
    namespace: saas-edge
    name: gateway-ingress-from-outside-cluster
  mechanism: cni
  applies_to_cni:
  - cilium
  label: must-not
  rationale: The rule is meant for 'outside the cluster'; not admitting nodes on Cilium is
    closer to intent. Nothing to fix.
  evidence: []
- id: f10
  class: other
  subject:
    kind: Service
    namespace: saas-edge
    name: gateway
    port: 8080
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: NodePort allocated on every node, but eTP=Local means only the edge node forwards
    (acknowledged in compromises). Not a finding.
  evidence: []
