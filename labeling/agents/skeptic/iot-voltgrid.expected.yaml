scenario: iot-voltgrid
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: ipblock-admits-node-ips
  subject:
    kind: Pod
    namespace: iot-edge
    name: ingest-gateway
    port: 8883
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: hostPort 8883 locked to ipBlock 10.250.0.10/32, one external client. A pod SNAT'd
    to a node IP (natOutgoing, or portmap hairpin SNAT) shows up as 172.18.x or the node's
    address, which the /32 does not match. Textbook tempting-but-wrong alarm.
  evidence: []
- id: f4
  class: ipblock-admits-node-ips
  subject:
    kind: Pod
    namespace: iot-edge
    name: dashboard-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: 'Same as ingest-gateway: hostPort 8080 restricted to 10.250.0.10/32; node IPs
    are not admitted.'
  evidence: []
- id: f5
  class: other
  subject:
    kind: Pod
    namespace: iot-edge
    name: ingest-gateway
    port: 8883
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: 'Using hostPort is itself not a finding: the pod stays on the pod network and
    under policy, and the only admitted source is the external /32. ingest-gateway :9000 is
    not published on the node.'
  evidence: []
- id: f6
  class: cilium-ipblock-cluster-addrs
  subject:
    kind: NetworkPolicy
    namespace: iot-edge
    name: ingest-gateway
  mechanism: cni
  applies_to_cni:
  - cilium
  label: must-not
  rationale: The ipBlock names an external address; world-only matching is exactly what is
    wanted.
  evidence: []
- id: f7
  class: hostnetwork-under-policy
  subject:
    kind: Workload
    namespace: iot-ops
    name: node-agent
  mechanism: hostnetwork
  applies_to_cni:
  - any
  label: must-not
  rationale: 'node-agent tolerates every taint but is pod-network (deliberately, caveat 4/5),
    ingress only from prometheus, egress: []. Nothing to report.'
  evidence: []
- id: f8
  class: node-exception-segment
  subject:
    kind: Namespace
    name: iot-data
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: No non-system hostNetwork pod anywhere; the data tier is on general nodes away
    from the edge. The node-local exception exists but nobody non-system uses it.
  evidence: []
- id: f9
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of iot-data / iot-edge. The spec always
    allows node-local traffic (kubelet probes depend on it) and these are cluster infrastructure
    the app team cannot and should not remove. Flagging them is noise; the class is about
    NON-system hostNetwork pods.
  evidence: []
- id: f10
  class: other
  subject:
    kind: NetworkPolicy
    namespace: iot-app
    name: alerting
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: 'Internet egress on 443 excluding every private, CGNAT, link-local and loopback
    range: cannot reach pods, nodes or the apiserver. Intended.'
  evidence: []
