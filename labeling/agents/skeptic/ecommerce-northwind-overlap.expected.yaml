scenario: ecommerce-northwind-overlap
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: other
  subject:
    kind: Service
    namespace: ecom-edge
    name: edge-proxy
    port: 8080
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: 'NodePort 30080 is allocated on every node but eTP=Local: only the edge node
    (DaemonSet on pool=edge) forwards. Flagging the NodePort itself is noise.'
  evidence: []
- id: f4
  class: node-exception-segment
  subject:
    kind: Namespace
    name: ecom-orders
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: checkout and orders-db (PCI) run on restricted nodes; no non-system hostNetwork
    pod exists in the scenario. Only kube-system DaemonSets share those nodes.
  evidence: []
- id: f5
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of ecom-orders/checkout and orders-db.
    The spec always allows node-local traffic (kubelet probes depend on it) and these are
    cluster infrastructure the app team cannot and should not remove. Flagging them is noise;
    the class is about NON-system hostNetwork pods.
  evidence: []
- id: f6
  class: other
  subject:
    kind: NetworkPolicy
    namespace: ecom-storefront
    name: web-ingress
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: Split ingress/egress policies and destination-side rules that are 'not tested
    in isolation' are a style choice; every flow is opened on both ends and default-deny covers
    the rest. Nothing diverges.
  evidence: []
- id: f7
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: ecom-edge
    name: edge-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - calico
  label: must
  severity: warning
  rationale: 'The edge-proxy ingress ipBlock 172.18.0.0/16 is the node network and excludes
    pods. A pod on a general node connecting to <edge-node-IP>:30080 is not DNAT''d locally
    (dst not a local address), leaves with Calico natOutgoing SNAT to its own node IP (172.18.x,
    outside the IP pool), and after DNAT on the edge node it matches the ipBlock -> allowed.
    So any pod with open egress (every non-ecom namespace, kube-system, other teams) reaches
    edge-proxy, contradicting ''any other namespace -> any ecom pod: deny''. Every hostNetwork
    process is admitted too. Fix: set the ipBlock to the real F5 SNAT range, disjoint from
    node IPs. Warning, not critical: edge-proxy is the public front door anyway.'
  evidence: []
- id: f8
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: ecom-edge
    name: edge-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - cilium
  label: must-not
  rationale: On Cilium, CIDR rules match 'world' only; pod traffic keeps its pod identity
    through the tunnel or, if masqueraded, arrives as remote-node, neither of which 172.18.0.0/16
    matches (default policy-cidr-match-mode). No pod bypass.
  evidence: []
- id: f9
  class: cilium-ipblock-cluster-addrs
  subject:
    kind: NetworkPolicy
    namespace: ecom-edge
    name: edge-proxy-ingress-from-f5
  mechanism: cni
  applies_to_cni:
  - cilium
  label: may
  severity: info
  rationale: The ipBlock literally equals the node network, so a reader could take it as 'allow
    the nodes'; on Cilium remote nodes are not matched, so declared node->edge-proxy allows
    are denied. Arguable because the author's intent was the F5 range, not the nodes; nobody
    needs to fix a safe-direction overblock.
  evidence: []
- id: f10
  class: other
  subject:
    kind: Service
    namespace: ecom-edge
    name: edge-proxy
    port: 8080
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: The lab external client 10.250.0.10 is outside 172.18.0.0/16, so it is denied.
    That matches the declared policy exactly; not an overblock.
  evidence: []
