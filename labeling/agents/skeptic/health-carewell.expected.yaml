scenario: health-carewell
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: health-edge
    name: edge-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - calico
  label: must
  severity: warning
  rationale: 'health-edge/edge-proxy ingress: 0.0.0.0/0 except 192.168.0.0/16. The except
    states the intent (README A1 and gap 9: ''the pod CIDR is excluded so that pods cannot
    use the public path as a pivot''), and the NodePort is eTP=Local on the edge node. A pod
    elsewhere connecting to <edge-node-IP>:<nodePort> is SNAT''d by Calico natOutgoing to
    its node IP, which the ipBlock admits, so any pod with open egress reaches edge-proxy.
    The author''s claim is false on this profile.'
  evidence: []
- id: f4
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: health-edge
    name: edge-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - cilium
  label: must-not
  rationale: Cilium applies CIDR rules to 'world' only; SNAT'd pod traffic arrives as remote-node
    (or keeps pod identity) and is not admitted. External 10.250.0.10 via eTP=Local is world
    and admitted as intended.
  evidence: []
- id: f5
  class: cilium-ipblock-cluster-addrs
  subject:
    kind: NetworkPolicy
    namespace: health-edge
    name: edge-proxy
  mechanism: cni
  applies_to_cni:
  - cilium
  label: must-not
  rationale: Node IPs being admitted is an accepted side effect on Calico (gap 9), not a requirement.
    On Cilium remote nodes are simply denied, the safer direction. Not worth a finding.
  evidence: []
- id: f6
  class: node-exception-segment
  subject:
    kind: Namespace
    name: health-phi
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: log-shipper (tolerates everything) and backup-agent run on the restricted nodes
    but are pod-network, not hostNetwork, and each is egress-limited to a single external
    /32 or /24. 'Other teams might schedule hostNetwork pods' (gap 1/2) is hypothetical; nothing
    in the manifests does it.
  evidence: []
- id: f7
  class: hostnetwork-under-policy
  subject:
    kind: Workload
    namespace: health-ops
    name: log-shipper
  mechanism: hostnetwork
  applies_to_cni:
  - any
  label: must-not
  rationale: Not hostNetwork. Privileged PSA and hostPath read-only mounts are outside a network-divergence
    tool's scope.
  evidence: []
- id: f8
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of health-phi / health-reporting (pool=restricted).
    The spec always allows node-local traffic (kubelet probes depend on it) and these are
    cluster infrastructure the app team cannot and should not remove. Flagging them is noise;
    the class is about NON-system hostNetwork pods.
  evidence: []
- id: f9
  class: other
  subject:
    kind: Service
    namespace: health-edge
    name: edge-proxy
    port: 8080
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: 'Auto-allocated NodePort on every node with eTP=Local: only the edge node forwards.
    Not a finding.'
  evidence: []
- id: f10
  class: other
  subject:
    kind: NetworkPolicy
    namespace: health-notify
    name: notifications
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: Broad 443/587 internet egress is acknowledged (gap 6) and excludes all private,
    CGNAT, link-local and loopback ranges, hence pods and nodes. FQDN restriction is a feature
    request, not a divergence.
  evidence: []
