scenario: fintech-paylane-hostnet-agent
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: fintech-edge
    name: edge-proxy
    port: 8080
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: 'fintech-edge/edge-proxy ingress ipBlock is 0.0.0.0/0 with no except: it admits
    pod IPs as well as node IPs, so SNAT gives a pod nothing it did not already have. The
    class requires ''admits nodes while NOT admitting pods''. The broad allow is the intended
    public entry (flow 1).'
  evidence: []
- id: f4
  class: cilium-ipblock-cluster-addrs
  subject:
    kind: NetworkPolicy
    namespace: fintech-edge
    name: edge-proxy
  mechanism: cni
  applies_to_cni:
  - cilium
  label: must-not
  rationale: On Cilium 0.0.0.0/0 matches only 'world', so pods/nodes are not admitted. The
    intent was internet-only ingress, so Cilium is closer to intent, not further. Nothing
    to fix.
  evidence: []
- id: f5
  class: other
  subject:
    kind: Service
    namespace: fintech-edge
    name: edge-proxy
    port: 8080
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: NodePort 30880 is allocated on every node, but eTP=Local means only the edge
    node (the only one with an edge-proxy pod) forwards; general and restricted nodes drop.
    Flagging 'NodePort open on CDE nodes' is noise (README gap 9 already covers the host-firewall
    question).
  evidence: []
- id: f6
  class: other
  subject:
    kind: NetworkPolicy
    namespace: fintech-cde
    name: card-gateway
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: Egress 0.0.0.0/0 except RFC1918/CGNAT/link-local/loopback on 443 excludes both
    the pod CIDR (192.168/16) and node IPs (172.18/16 in 172.16/12). Egress policy is evaluated
    before natOutgoing SNAT, so SNAT cannot widen it. Same for fintech-ops/node-agent's egress
    rule.
  evidence: []
- id: f7
  class: other
  subject:
    kind: Workload
    namespace: fintech-app
    name: admin-panel
    port: 8080
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: 'ingress: [] (no network ingress) is deliberate; staff use kubectl port-forward,
    which enters the pod netns via the kubelet/CRI and is not subject to NetworkPolicy by
    design. Not an overblock, not a bypass.'
  evidence: []
- id: f8
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of fintech-cde (pool=restricted). The
    spec always allows node-local traffic (kubelet probes depend on it) and these are cluster
    infrastructure the app team cannot and should not remove. Flagging them is noise; the
    class is about NON-system hostNetwork pods.
  evidence: []
- id: f9
  class: hostnetwork-under-policy
  subject:
    kind: Workload
    namespace: fintech-ops
    name: node-agent
    port: 9100
  mechanism: hostnetwork
  applies_to_cni:
  - calico
  - cilium
  label: must
  severity: warning
  rationale: 'fintech-ops/default-deny-all, allow-dns-egress and the node-agent policy (ingress
    only prometheus:9100, egress only 443 to non-private) all select the node-agent DaemonSet,
    which is now hostNetwork. Per the docs, behaviour for hostNetwork pods is undefined; in
    practice none of these rules apply: :9100 (node-exporter) and :2020 (fluent-bit HTTP)
    listen on every node IP, including the internet-facing edge node and the CDE nodes, and
    egress is unrestricted. The policy reads as locked down but does nothing.'
  evidence: []
- id: f10
  class: node-exception-segment
  subject:
    kind: Namespace
    name: fintech-cde
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must
  severity: critical
  rationale: 'A non-system hostNetwork DaemonSet (tolerations: operator Exists) runs on both
    restricted nodes. Node -> local-pod traffic is always allowed, so fluent-bit/node-exporter
    can connect to payments-core, card-gateway, ledger and postgres:5432 on their node despite
    default-deny-all, violating intended deny #23 (''monitoring must not become a path into
    the CDE''). README gap 1 verified this exact path. PCI CDE, so critical.'
  evidence: []
- id: f11
  class: node-exception-segment
  subject:
    kind: Namespace
    name: fintech-app
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: may
  severity: warning
  rationale: Same agent on the general nodes sits inside fintech-app's segment (checkout-api,
    redis, admin-panel). Real, but same root cause and fix as the fintech-cde finding; a tool
    may fold it into one.
  evidence: []
- id: f12
  class: node-exception-segment
  subject:
    kind: Namespace
    name: fintech-edge
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: may
  severity: info
  rationale: Same agent on the edge node can reach edge-proxy:8080, which is already open
    to 0.0.0.0/0; low marginal impact, same root cause.
  evidence: []
- id: f13
  class: other
  subject:
    kind: NetworkPolicy
    namespace: fintech-ops
    name: prometheus
  mechanism: hostnetwork
  applies_to_cni:
  - calico
  - cilium
  label: may
  severity: info
  rationale: 'Overblock side effect: prometheus egress allows only podSelector app=node-agent:9100.
    With node-agent on hostNetwork its endpoints are node IPs, which Calico/Cilium do not
    match with a podSelector, so the intended scrape (flow 11) is likely denied. Operationally
    visible, arguably not a security finding.'
  evidence: []
