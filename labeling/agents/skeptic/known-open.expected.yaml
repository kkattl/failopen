# Blind labels for scenario: known-open
# Source: testdata/scenarios/known-open/manifests.yaml (+ README.md)
#
# Rules (labeling/README.md): label from the manifests and the Kubernetes
# docs ONLY. Do not open testdata/scenarios/known-open/*/reachability.json
# before this file is done. Lab facts you may use: pod CIDR 192.168.0.0/16,
# node IPs 172.18.0.0/16, external clients 10.250.0.0/24, pools
# general/edge/restricted (edge and restricted are tainted).
#
# ---------------------------------------------------------------- inventory
# Namespaces: known-open
#
# Workloads:
#   Deployment known-open/web x2 labels={'app': 'web'} ports=[8080] nodeSelector pool=general
#   Pod known-open/client labels={'app': 'client'} ports=[] nodeSelector pool=general
#   Pod known-open/hostport labels={'app': 'hostport'} ports=[8080->hostPort 30901] hostPort nodeSelector pool=general
#   Pod known-open/hostnet labels={'app': 'hostnet'} ports=[30902] hostNetwork nodeSelector pool=general
#
# Services:
#   Service known-open/web-cluster type=NodePort externalTrafficPolicy=Cluster selector={'app': 'web'} ports=[80->http]
#   Service known-open/web-local type=NodePort externalTrafficPolicy=Local selector={'app': 'web'} ports=[80->http]
#
# NetworkPolicies:
# --------------------------------------------------------------------------

scenario: known-open
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - any
  label: must-not
  rationale: There are no NetworkPolicies at all, so there is nothing for any CNI (flannel
    included) to fail to enforce. Declared = allow everywhere.
  evidence: []
- id: f2
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: known-open
    name: web-cluster
    port: 80
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: No ipBlock, no policy. kube-proxy SNAT (eTP=Cluster) changes nothing about a
    declared-open service.
  evidence: []
- id: f3
  class: other
  subject:
    kind: Service
    namespace: known-open
    name: web-cluster
    port: 80
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: NodePort with eTP=Cluster exposed on every node is exactly what the declared
    (empty) policy allows; flagging NodePorts per se is noise.
  evidence: []
- id: f4
  class: other
  subject:
    kind: Service
    namespace: known-open
    name: web-local
    port: 80
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: 'eTP=Local NodePort: nodes without a web pod drop traffic. That is standard kube-proxy
    behaviour, not a policy divergence.'
  evidence: []
- id: f5
  class: other
  subject:
    kind: Pod
    namespace: known-open
    name: hostport
    port: 30901
  mechanism: other
  applies_to_cni:
  - any
  label: must-not
  rationale: 'hostPort 30901 with no policy: open by declaration. Not a finding.'
  evidence: []
- id: f6
  class: hostnetwork-under-policy
  subject:
    kind: Pod
    namespace: known-open
    name: hostnet
    port: 30902
  mechanism: hostnetwork
  applies_to_cni:
  - any
  label: must-not
  rationale: No NetworkPolicy selects it (there are none).
  evidence: []
- id: f7
  class: node-exception-segment
  subject:
    kind: Namespace
    name: known-open
  mechanism: node-local
  applies_to_cni:
  - any
  label: must-not
  rationale: No restrictive policy, so there is no segment for the hostNetwork pod to sit
    inside.
  evidence: []
