# Blind labels for scenario: demo-payments
# Source: testdata/scenarios/demo-payments/manifests.yaml (+ README.md)
#
# Rules (labeling/README.md): label from the manifests and the Kubernetes
# docs ONLY. Do not open testdata/scenarios/demo-payments/*/reachability.json
# before this file is done. Lab facts you may use: pod CIDR 192.168.0.0/16,
# node IPs 172.18.0.0/16, external clients 10.250.0.0/24, pools
# general/edge/restricted (edge and restricted are tainted).
#
# ---------------------------------------------------------------- inventory
# Namespaces: monitoring, payments
#
# Workloads:
#   Pod payments/api-server labels={'app': 'api-server'} ports=[80]
#   Pod payments/host-probe labels={'app': 'host-probe'} ports=[8080] hostNetwork
#   Pod monitoring/node-agent labels={} ports=[] hostNetwork
#
# Services:
#   Service payments/api-nodeport type=NodePort externalTrafficPolicy=Cluster selector={'app': 'api-server'} ports=[80->80 nodePort 31080]
#
# NetworkPolicies:
#   NetworkPolicy payments/default-deny-all selects=ALL pods types=['Ingress']
# --------------------------------------------------------------------------

scenario: demo-payments
labeler: agent-skeptic
labeled_at: 2026-09-24
blind: true

findings:
- id: f1
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - flannel
  label: must
  severity: critical
  rationale: NetworkPolicies exist but flannel implements none of them, so every declared
    deny (default-deny-all, per-workload allow lists) is a no-op. This is the single most
    important thing to tell the operator on this profile.
  evidence: []
- id: f2
  class: cni-not-enforcing
  subject:
    kind: Cluster
  mechanism: cni
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: Calico and Cilium both enforce networking.k8s.io/v1 NetworkPolicy. Reporting
    'CNI not enforcing' here would be a pure false positive.
  evidence: []
- id: f3
  class: hostnetwork-under-policy
  subject:
    kind: Pod
    namespace: payments
    name: host-probe
    port: 8080
  mechanism: hostnetwork
  applies_to_cni:
  - calico
  - cilium
  label: must
  severity: warning
  rationale: 'payments/default-deny-all (podSelector {}) selects host-probe, which is hostNetwork.
    The NetworkPolicy docs say behaviour for hostNetwork pods is undefined; Calico and Cilium
    enforce on the pod veth, which this pod does not have, so its :8080 listens on the node
    IP and answers every pod and external client despite the namespace''s declared default-deny.
    Fix: drop hostNetwork or move it out of the protected namespace.'
  evidence: []
- id: f4
  class: node-exception-segment
  subject:
    kind: Namespace
    name: payments
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must
  severity: warning
  rationale: 'monitoring/node-agent is a hostNetwork Pod (not a system DaemonSet) pinned via
    podAffinity to the node running payments/api-server. The spec always allows traffic from
    the node to its own pods, and a hostNetwork pod IS the node, so node-agent reaches api-server:80
    despite default-deny-all. (host-probe contributes the same way if co-scheduled.) Worth
    fixing: an innocuous-looking ''agent'' sits inside the payments segment.'
  evidence: []
- id: f5
  class: hostnetwork-under-policy
  subject:
    kind: Pod
    namespace: monitoring
    name: node-agent
  mechanism: hostnetwork
  applies_to_cni:
  - any
  label: must-not
  rationale: No NetworkPolicy exists in 'monitoring', so nothing selects this pod; the 'under-policy'
    class does not apply. Its real problem is captured by the node-exception-segment finding
    on Namespace payments.
  evidence: []
- id: f6
  class: ipblock-admits-node-ips
  subject:
    kind: Service
    namespace: payments
    name: api-nodeport
    port: 80
  mechanism: snat
  applies_to_cni:
  - any
  label: must-not
  rationale: There is no ipBlock anywhere in this scenario. default-deny-all denies node IPs
    just like pod IPs, so SNAT to a node address gains nothing.
  evidence: []
- id: f7
  class: other
  subject:
    kind: Service
    namespace: payments
    name: api-nodeport
    port: 80
  mechanism: snat
  applies_to_cni:
  - calico
  label: must-not
  rationale: '''NodePort bypasses default-deny'' is the tempting alarm. With iptables kube-proxy
    the NodePort is DNAT''d to the pod IP and FORWARDed, so Calico applies the workload ingress
    policy and default-deny drops it (the manifest comment records this was verified). A NodePort
    whose backends are fully denied is at most dead config, not an exposure.'
  evidence: []
- id: f8
  class: other
  subject:
    kind: Service
    namespace: payments
    name: api-nodeport
    port: 80
  mechanism: node-local
  applies_to_cni:
  - cilium
  label: may
  severity: warning
  rationale: 'Arguable/uncertain: externalTrafficPolicy=Cluster makes kube-proxy masquerade
    NodePort traffic. When it enters on the node that runs api-server, the masqueraded source
    is a local host address, which Cilium classifies as reserved:host and allows by default
    (node-local exception), so external clients or pods could reach api-server through <that-node>:31080
    despite default-deny-all. If the oracle shows it, it is a real bypass; if not, fine.'
  evidence: []
- id: f9
  class: node-exception-segment
  subject:
    kind: Workload
    namespace: kube-system
    name: kube-proxy
  mechanism: node-local
  applies_to_cni:
  - calico
  - cilium
  label: must-not
  rationale: kube-proxy, the CNI agent (calico-node / cilium) and other kube-system hostNetwork
    DaemonSets run on every node, including the nodes of payments/api-server. The spec always
    allows node-local traffic (kubelet probes depend on it) and these are cluster infrastructure
    the app team cannot and should not remove. Flagging them is noise; the class is about
    NON-system hostNetwork pods.
  evidence: []
