scenario: saas-formcraft-etp-cluster
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      The ipBlock 0.0.0.0/0 except the pod CIDR admits node IPs, and the
      NodePort now uses externalTrafficPolicy=Cluster, so kube-proxy
      masquerades every NodePort client to a node address before policy is
      evaluated. Pods reaching any node's :31480 whose masquerade source ends
      up a node IP (always true on the edge node itself; also the natOutgoing
      path from the base scenario) pass the rule meant to exclude pods. That
      violates README row 1 ("no pod can use the gateway to hop into a
      tenant") for every pod with open egress. Tenant pods are still stopped
      by their own egress policies, hence warning.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      On Cilium with kube-proxy kept, traffic masqueraded to the edge node's
      own IP and delivered to the local gateway likely carries the "host"
      identity, which is allowed by default (allow-localhost). The rule would
      then be bypassed even though CIDR peers do not match nodes. Traffic
      forwarded from other nodes arrives as remote-node and would be denied.
      The mechanism differs from Calico's, so this stays a may.
    evidence: []
  - id: f3
    class: other
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico, cilium]
    label: may
    severity: warning
    rationale: >
      With ETP=Cluster every node, including the tainted restricted pool,
      now answers :31480 and forwards to the gateway. That contradicts the
      design ("only the edge node answers; general and restricted nodes drop
      the traffic"). The client IP is also lost, so the source-IP ingress
      policy no longer tells real external clients from SNAT'd in-cluster
      ones. On Calico IPIP, cross-node forwarding may masquerade to the
      tunl0 address (pod CIDR), turning legitimate external clients into
      "pods" and dropping them. The exposure-surface change is real, but its
      audit weight depends on whether the edge LB can route to non-edge
      nodes, hence may.
    evidence: []
  - id: f4
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: flannel ignores NetworkPolicy. There is no tenant isolation at all.
    evidence: []
  - id: f5
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f6
    class: node-exception-segment
    subject: {kind: Namespace, namespace: saas-tenant-acme, name: saas-tenant-acme}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      There is no non-system hostNetwork pod. The same applies to globex and
      initech.
    evidence: []
