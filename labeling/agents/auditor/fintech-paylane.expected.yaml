scenario: fintech-paylane
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      flannel ignores NetworkPolicy. The PCI CDE (fintech-cde: payments-core,
      card-gateway, ledger, postgres:5432) is reachable from every pod in the
      cluster, which breaks the whole README flow matrix (rows 13-25). This is
      a PCI DSS segmentation failure.
    evidence: []
  - id: f2
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f3
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      The edge-proxy ingress ipBlock is 0.0.0.0/0 with no except. It admits
      node IPs, but it also admits pods on purpose (public entry point, flow
      1), so SNAT to a node IP grants nothing beyond what is already declared.
      This is exactly the README's "broad allow that already admits pods"
      negative.
    evidence: []
  - id: f4
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-cde, name: fintech-cde}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      The only workload besides the CDE pods on pool=restricted is
      fintech-ops/node-agent, and it is deliberately on the pod network (not
      hostNetwork). Its pod IP is policed like any pod, and
      fintech-cde/default-deny-all admits nothing from it. The remaining
      host-netns traffic on those nodes comes from the kubelet and
      kube-system CNI/kube-proxy agents: system components the spec
      explicitly excepts. The designer documents that residual risk (known
      gap 1). No non-system hostNetwork pod is present, so the segment holds.
    evidence: []
  - id: f5
    class: other
    subject: {kind: Service, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      NodePort 30880 is allocated on general and restricted (CDE) nodes, but
      with externalTrafficPolicy=Local those nodes have no local endpoint and
      drop the traffic (flow 13 intent). An allocated port that forwards to
      nothing is not an exposure of the CDE nodes.
    evidence: []
  - id: f6
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      0.0.0.0/0 is declared to admit everything, including in-cluster pods
      and nodes. Cilium applies CIDR peers to the "world" identity only, so
      other pods and host-network sources hitting edge-proxy:8080 may be
      dropped. This is overblock (it fails closed), not a segmentation
      failure, so it is only informational from an audit point of view.
    evidence: []
