scenario: ecommerce-northwind
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      flannel ignores NetworkPolicy. The PCI-scoped ecom-orders/checkout and
      orders-db:5432 are reachable from every pod, as are all other ecom-*
      pods, which breaks "any other namespace -> any ecom pod: deny" and
      "anyone outside ecom-orders -> orders-db: deny (PCI)".
    evidence: []
  - id: f2
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f3
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      The ingress ipBlock is 10.250.0.0/24, the external/F5 network. It is
      disjoint from node IPs (172.18.0.0/16) and pods (192.168.0.0/16), so a
      pod SNAT'd to a node IP by natOutgoing does not match. ETP=Local keeps
      the real client IP for the F5 path. The public entry is locked to the
      external network as intended.
    evidence: []
  - id: f4
    class: node-exception-segment
    subject: {kind: Namespace, namespace: ecom-orders, name: ecom-orders}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      checkout and orders-db (PCI) run on pool=restricted. No non-system
      hostNetwork pod exists in the scenario, so only the kubelet and
      kube-system agents share those nodes, which is the spec's documented
      node exception. This is not a segmentation failure the team can fix.
    evidence: []
  - id: f5
    class: other
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      NodePort 30080 is allocated on non-edge nodes, but with
      externalTrafficPolicy=Local they drop it (the README's "not served"
      row). It is not an exposure.
    evidence: []
