scenario: iot-voltgrid
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Pod, namespace: iot-edge, name: ingest-gateway, port: 8883}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      hostPort 8883 is locked to ipBlock 10.250.0.10/32, a single external
      host outside the node subnet. A pod SNAT'd to a node IP (natOutgoing)
      does not match, and the portmap DNAT keeps the external client IP. This
      is the README's canonical negative: "a hostPort locked to one external
      /32".
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Pod, namespace: iot-edge, name: dashboard-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      hostPort 8080 is locked to ipBlock 10.250.0.10/32, the same as f1. The
      rule admits no node or pod IPs.
    evidence: []
  - id: f3
    class: node-exception-segment
    subject: {kind: Namespace, namespace: iot-data, name: iot-data}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      node-agent tolerates every taint but runs on the pod network, under
      iot-ops/node-agent (egress: []). The data tier is kept off the edge
      node on purpose. No non-system hostNetwork pod exists, so node-local
      traffic is limited to the kubelet/system exception.
    evidence: []
  - id: f4
    class: hostnetwork-under-policy
    subject: {kind: Workload, namespace: iot-ops, name: node-agent, port: 9200}
    mechanism: hostnetwork
    applies_to_cni: [any]
    label: must-not
    rationale: >
      This looks like the classic vendor agent on every node, but it is not
      hostNetwork. Its policy (ingress from prometheus only, no egress) is
      enforceable.
    evidence: []
  - id: f5
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      flannel ignores NetworkPolicy. The device-facing tier reaches the data
      tier (D1), the third-party node-agent has egress (D7), and every pod
      reaches registry-db/tsdb. The OT/IT tiering intent is void.
    evidence: []
  - id: f6
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f7
    class: other
    subject: {kind: Pod, namespace: iot-edge, name: ingest-gateway, port: 9000}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      The internal consumer API :9000 is not a hostPort, so it is not
      published on the plant-facing node IP. It is reachable only from
      stream-processor via the pod network, as declared.
    evidence: []
