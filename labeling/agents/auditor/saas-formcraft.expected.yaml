scenario: saas-formcraft
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      gateway-ingress-from-outside-cluster admits 0.0.0.0/0 except
      192.168.0.0/16. It excludes pods but admits node IPs (172.18.0.0/16),
      and gateway is behind NodePort 31480. README row 1 states the intent
      explicitly: "no pod can use the gateway to hop into a tenant". Path: a
      pod on a general node connects to <edge node IP>:31480. It is not
      local to the source node, so kube-proxy does not DNAT it there.
      Calico natOutgoing masquerades it to the source node IP. The edge
      node's kube-proxy DNATs it to the local gateway (ETP=Local keeps that
      node source), and the node IP passes the except. Any pod whose egress
      is open (another team's namespace, kube-system) then gets the gateway
      and, through Host-header routing, every tenant app. Tenant pods
      themselves are still stopped by their own egress default-deny (row 11
      holds), which is why this is warning, not critical.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      The static condition is the same as f1. On Cilium the ipBlock matches
      only the "world" identity, so a SNAT'd source carrying the
      remote-node/host identity would not match, and the bypass likely does
      not occur. It is a may until measured.
    evidence: []
  - id: f3
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      flannel ignores NetworkPolicy. Contractual tenant isolation (row 10:
      tenant X -> tenant Y db:5432) does not exist, which is a multi-tenant
      isolation failure.
    evidence: []
  - id: f4
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f5
    class: node-exception-segment
    subject: {kind: Namespace, namespace: saas-tenant-acme, name: saas-tenant-acme}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Tenants share general-pool nodes (documented and accepted), but no
      non-system hostNetwork pod exists. Node-local traffic is only kubelet
      and kube-system, the spec exception. The same applies to globex and
      initech.
    evidence: []
  - id: f6
    class: other
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      NodePort 31480 is allocated on every node, but with ETP=Local
      non-edge nodes drop it, as documented. It is not an exposure.
    evidence: []
  - id: f7
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: saas-edge, name: gateway-ingress-from-outside-cluster, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      The rule declares node IPs admitted (0.0.0.0/0 minus pods), and Cilium
      will not match node/host sources with a CIDR peer. This is overblock
      only (fails closed), so it has no audit impact.
    evidence: []
