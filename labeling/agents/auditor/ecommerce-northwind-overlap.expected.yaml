scenario: ecommerce-northwind-overlap
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      edge-proxy-ingress-from-f5 admits ipBlock 172.18.0.0/16, which contains
      every node IP but no pod IP. edge-proxy sits behind NodePort 30080.
      Path: a pod on a general/restricted node connects to <edge node
      IP>:30080. The destination is not local to the source node, so
      kube-proxy does not DNAT it there. Calico natOutgoing (destination
      outside the IP pool) masquerades it to the source node's IP. The edge
      node's kube-proxy then DNATs it to the local edge-proxy with
      ETP=Local, keeping the now-node source, which matches 172.18.0.0/16.
      Any pod in the cluster whose egress is not restricted (other teams'
      namespaces, kube-system, etc.) reaches the storefront entry point,
      against "any other namespace in the cluster -> any ecom pod: deny" and
      the intent that only the F5 reaches the edge. Warning rather than
      critical: edge-proxy is internet-facing by design and only forwards to
      web/bff. The PCI checkout is still reachable only through the bff
      application path, not directly.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      The static condition is identical, so a config-only detector will fire.
      But Cilium applies ipBlock to "world" only: node/host sources carry the
      host/remote-node identity and do not match 172.18.0.0/16, so the SNAT
      bypass probably does not materialise. It is a may because
      Cilium-with-kube-proxy masquerade/identity behaviour is not certain.
    evidence: []
  - id: f3
    class: other
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: hostnetwork
    applies_to_cni: [calico]
    label: may
    severity: info
    rationale: >
      This is a second, lower-impact path from the same rule: any hostNetwork
      process or node (kubelet, kube-system agents) sources from a node IP
      inside 172.18.0.0/16 and is admitted by policy. Strictly that is
      "declared allow" (the ipBlock literally contains them), so it is only a
      may. The fix is the same as f1.
    evidence: []
  - id: f4
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: flannel ignores NetworkPolicy. PCI orders-db and checkout are open to every pod.
    evidence: []
  - id: f5
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f6
    class: node-exception-segment
    subject: {kind: Namespace, namespace: ecom-orders, name: ecom-orders}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      This is unchanged from the base scenario: there are no non-system
      hostNetwork pods on the restricted nodes.
    evidence: []
