scenario: health-carewell
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      The edge-proxy ingress ipBlock is 0.0.0.0/0 except 192.168.0.0/16, and
      edge-proxy is behind a NodePort (ETP=Local). The author accepts that
      node/host-network processes get in (known limitation 9) but states
      "the pod CIDR is excluded so that pods cannot use the public path as a
      pivot". Path: a pod on a general/restricted node connects to <edge node
      IP>:<nodePort>. Calico natOutgoing masquerades it to its node IP, and
      the edge node DNATs it locally with the node source preserved, which
      passes the except. Any pod in the cluster with open egress reaches
      edge-proxy and, through it, portal -> records-api (the PHI API). HIPAA
      impact is bounded because edge-proxy is internet-facing anyway and PHI
      still sits behind records-api's application controls, hence warning.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      This is the same static condition as f1. Cilium's CIDR peers match
      "world" only, so a SNAT'd node source (remote-node identity) probably
      does not match. It is a may until measured.
    evidence: []
  - id: f3
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      The README (limitation 9) declares node IPs admitted. Cilium will not
      match node/host sources with the CIDR peer. This is overblock only,
      with no audit impact.
    evidence: []
  - id: f4
    class: node-exception-segment
    subject: {kind: Namespace, namespace: health-phi, name: health-phi}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      log-shipper (tolerates everything) and backup-agent share the
      restricted nodes with PHI, but both run on the pod network. They are
      selected by health-ops policies (egress only to fixed external IPs),
      and PHI ingress does not admit them. That keeps the "backup-agent /
      log-shipper -> any pod: deny" intent. No non-system hostNetwork pod
      exists. The residual host -> local pod path (limitation 1) is the
      spec's kubelet/system exception. The same holds for health-reporting.
    evidence: []
  - id: f5
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      flannel ignores NetworkPolicy. PHI (records-db:5432, reporting-replica
      full copy, imaging, audit-log) is reachable from every pod, which is a
      HIPAA segmentation failure.
    evidence: []
  - id: f6
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f7
    class: other
    subject: {kind: Service, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      The auto-allocated NodePort is open on restricted (PHI) nodes too, but
      with ETP=Local those nodes have no local endpoint and drop it. It is
      not an exposure.
    evidence: []
