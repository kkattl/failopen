scenario: fintech-paylane-hostnet-agent
labeler: agent-auditor
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-cde, name: fintech-cde}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must
    severity: critical
    rationale: >
      fintech-ops/node-agent is now hostNetwork and tolerates every taint
      (operator: Exists), so it runs on both restricted (CDE) nodes. The spec
      always allows node -> local pod traffic. Calico (default) and Cilium
      (allow-localhost) treat a hostNetwork pod's traffic as that node's
      traffic, so the agent (node-exporter + fluent-bit, a third-party log
      shipper with internet egress) reaches payments-core:8080,
      card-gateway:8080, ledger:8080 and postgres:5432 on its node. This
      directly violates flow 23 ("monitoring must not become a path into the
      CDE"), flow 19 ("only ledger talks to the DB") and flow 15 (single CDE
      entry point). The original author's known gap 1 predicts exactly this.
      For PCI it puts a non-CDE system into CDE scope.
    evidence: []
  - id: f2
    class: hostnetwork-under-policy
    subject: {kind: Workload, namespace: fintech-ops, name: node-agent, port: 9100}
    mechanism: hostnetwork
    applies_to_cni: [calico, cilium]
    label: must
    severity: warning
    rationale: >
      fintech-ops/default-deny-all and fintech-ops/node-agent select the
      now-hostNetwork DaemonSet pods. Per the NetworkPolicy docs the effect on
      hostNetwork pods is undefined, and in practice it is none. Ingress
      "only prometheus on 9100" (flow 24 "metrics are not public") no longer
      holds: :9100 and fluent-bit's :2020 are bound on every node IP,
      including the edge node, and are reachable by any pod, node or external
      client. The egress restriction ("443 to the internet only") no longer
      holds either, which is what makes f1 exploitable. Both the port and
      the egress intent are voided.
    evidence: []
  - id: f3
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-app, name: fintech-app}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: may
    severity: warning
    rationale: >
      Same root cause as f1 on the general nodes. The hostNetwork node-agent
      reaches redis:6379, checkout-api:8080 and admin-panel:8080 on its node,
      against flows 16 and 25 (redis only from checkout-api; admin-panel has
      no ingress). This is a connected-to (not CDE) zone, and the fix is the
      same as f1, so a detector may report it separately or fold it into f1.
    evidence: []
  - id: f4
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-edge, name: fintech-edge}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      edge-proxy's ingress ipBlock is 0.0.0.0/0, which already admits node
      IPs and pods, so the co-located hostNetwork agent reaching
      edge-proxy:8080 is declared-allowed. No intent is violated.
    evidence: []
  - id: f5
    class: other
    subject: {kind: NetworkPolicy, namespace: fintech-ops, name: prometheus, port: 9100}
    mechanism: hostnetwork
    applies_to_cni: [calico, cilium]
    label: may
    severity: info
    rationale: >
      prometheus's egress peer podSelector app=node-agent now points at
      hostNetwork pods whose IPs are node IPs. CNIs generally do not resolve
      pod selectors to hostNetwork pods, so the scrape (flow 11) is likely
      blocked. This is overblock, an availability issue rather than an audit
      one.
    evidence: []
  - id: f6
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: flannel ignores NetworkPolicy. The CDE is open to every pod (see fintech-paylane f1).
    evidence: []
  - id: f7
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: Both CNIs enforce NetworkPolicy.
    evidence: []
  - id: f8
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Unchanged from the base scenario: ipBlock 0.0.0.0/0 admits pods on
      purpose, so SNAT to a node IP does not widen access.
    evidence: []
