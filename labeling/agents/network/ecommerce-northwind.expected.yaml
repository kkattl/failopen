scenario: ecommerce-northwind
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: n1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      NodePort 30080 (ETP Local) to edge-proxy, ingress ipBlock 10.250.0.0/24 (the
      external lab network) only. It admits neither node IPs (172.18/16) nor pods.
      A pod on another node hitting edge-IP:30080 is masqueraded by Calico
      natOutgoing to its node IP, which the rule doesn't match, so it's denied. ETP
      Local keeps the real client IP, so 10.250.0.10 is admitted as intended. This is
      the corrected twin of ecommerce-northwind-overlap; flagging it would be a false
      positive.
    evidence: []
  - id: n2
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: ecom-edge, name: edge-proxy-ingress-from-f5, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: must-not
    rationale: >
      The ipBlock is meant for, and only covers, an out-of-cluster range. Cilium's
      world-only CIDR matching gives the same result as the spec.
    evidence: []
  - id: ec-nes
    class: node-exception-segment
    subject: {kind: Namespace, namespace: ecom-orders, name: ecom-orders}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      No hostNetwork workloads at all. checkout/orders-db on the restricted nodes share
      them only with system hostNetwork components (kubelet, kube-proxy, CNI agent),
      which the class excludes.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
