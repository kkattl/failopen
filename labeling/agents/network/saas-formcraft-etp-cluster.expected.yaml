scenario: saas-formcraft-etp-cluster
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      Same hole as saas-formcraft f1, plus kube-proxy masquerade. With
      externalTrafficPolicy Cluster every NodePort hit is marked for MASQUERADE, so
      the gateway policy's ipBlock (0.0.0.0/0 except the pod CIDR) is judged against
      rewritten sources. On Calico: a pod on node A sending to <edge IP>:31480 is
      natOutgoing-SNAT'd to node A's IP before reaching the edge node. There the
      FORWARD-chain policy sees node A's IP, which is admitted, so tenant isolation's
      "front door" guarantee (flow 11) fails for any pod with open egress. The spec
      explicitly leaves it undefined whether SNAT happens before or after policy.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      On Cilium (iptables kube-proxy, policy enforced at the endpoint after
      POSTROUTING), ETP Cluster masquerades traffic delivered to the local gateway
      pod on the edge node to a local host address. Cilium classifies that as
      reserved:host, which is allowed to local endpoints by default. So any
      source reaching <edge IP>:31480, including SNAT'd pods, would pass regardless
      of the ipBlock. Unlike the ETP Local original, where I expect Cilium to deny.
      The mechanism is the host exception rather than the CIDR match, and I'm not
      certain of the source-address selection, hence may.
    evidence: []
  - id: f3
    class: other
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: may
    severity: warning
    rationale: >
      The design relies on externalTrafficPolicy Local ("only the edge node answers";
      "the client source IP is kept, which the ingress policy depends on"). With
      Cluster, general and restricted nodes also forward 31480, and the client IP is
      lost to SNAT, so the ipBlock can no longer tell the LB/internet apart from
      in-cluster sources. On Calico IPIP, external clients entering via a non-edge
      node probably arrive with the tunl0 address (pod CIDR) and get denied by the
      except (an accidental overblock). On flannel they're served. Worth a warning,
      but it may be folded into f1.
    evidence: []
  - id: n1
    class: node-exception-segment
    subject: {kind: Namespace, namespace: saas-tenant-acme, name: saas-tenant-acme}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      No hostNetwork workloads, no DaemonSets. Tenants share general nodes only with
      each other's pods (all on the pod network) and system components. Same for
      globex and initech.
    evidence: []
  - id: n2
    class: other
    subject: {kind: NetworkPolicy, namespace: saas-platform, name: mailer-egress-to-external-smtp, port: 25}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Internet egress 0.0.0.0/0 on 25/465/587 with private, CGNAT, link-local and
      loopback excepted. It can't reach pods, nodes or the lab external network.
      Intentional.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
