scenario: iot-voltgrid
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: n1
    class: ipblock-admits-node-ips
    subject: {kind: Pod, namespace: iot-edge, name: ingest-gateway, port: 8883}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      hostPort 8883 (portmap DNAT on the edge node IP) with ingress ipBlock
      10.250.0.10/32, a single external host. Node IPs are not admitted. A pod on
      another node that hits <edge IP>:8883 gets masqueraded to its node IP by
      natOutgoing and is denied. portmap only masquerades hairpin/localhost, so
      the external client's source survives and is admitted as intended. This is the
      README's "hostPort locked to one external /32" negative.
    evidence: []
  - id: n2
    class: ipblock-admits-node-ips
    subject: {kind: Pod, namespace: iot-edge, name: dashboard-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Same as n1 for hostPort 8080 and ipBlock 10.250.0.10/32.
    evidence: []
  - id: n3
    class: node-exception-segment
    subject: {kind: Namespace, namespace: iot-data, name: iot-data}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      iot-ops/node-agent tolerates every taint but is on the pod network
      (not hostNetwork), under default-deny with no egress. No non-system
      hostNetwork pod shares nodes with tsdb/registry-db. Host processes on the edge
      node reaching ingest-gateway/dashboard-proxy are the spec's node-local
      exception, not a finding.
    evidence: []
  - id: n4
    class: hostnetwork-under-policy
    subject: {kind: Workload, namespace: iot-edge, name: ingest-gateway, port: 8883}
    mechanism: hostnetwork
    applies_to_cni: [any]
    label: must-not
    rationale: >
      hostPort is not hostNetwork: the pod keeps its own netns and veth, so policy
      is enforced after the portmap DNAT. A tool must not treat hostPort as
      hostNetwork.
    evidence: []
  - id: m1
    class: other
    subject: {kind: Pod, namespace: iot-edge, name: ingest-gateway, port: 8883}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      Cilium without kube-proxy replacement supports hostPort only when portmap is
      chained (or hostPort/BPF KPR is enabled). If the lab profile lacks it, the
      declared-allow plant flows (10.250.0.10 -> edge:8883/:8080) are dropped: an
      overblock that comes from CNI configuration, not from policy. Depends on the
      lab install, so may.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
