#       ingress ipBlock 0.0.0.0/0 ports=8080
#   NetworkPolicy fintech-app/checkout-api selects={'app': 'checkout-api'} types=['Ingress', 'Egress']
#   NetworkPolicy fintech-app/redis selects={'app': 'redis'} types=['Ingress', 'Egress']
