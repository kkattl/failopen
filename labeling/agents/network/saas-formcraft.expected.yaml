scenario: saas-formcraft
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      NodePort 31480 (ETP Local) to saas-edge/gateway. Its policy
      gateway-ingress-from-outside-cluster admits 0.0.0.0/0 except 192.168.0.0/16. The
      stated intent (flow 1 and flow 11) is that no pod can use the gateway to reach
      tenants. Node IPs (172.18/16) are admitted. A pod on a non-edge node sending to
      <edge IP>:31480 is masqueraded by Calico natOutgoing to its node IP (the
      destination is outside the IP pools). The edge node DNATs it to the local
      gateway pod with the source kept (ETP Local), and the policy sees a node IP,
      which passes. The gateway then proxies to any tenant app by Host header. saas-*
      tenant pods are themselves egress-denied, so the leak is to pods in other
      namespaces (other teams) and hostNetwork processes. Severity is warning: the
      gateway is public anyway, but the explicit "no pod" guarantee is false.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: saas-edge, name: gateway, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      Same structure. On Cilium with ETP Local I expect the masqueraded source to be
      identified as remote-node, which CIDR peers do not match by default, so the
      pivot is probably denied there.
    evidence: []
  - id: f3
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: saas-edge, name: gateway-ingress-from-outside-cluster, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      The CIDR peer covers node IPs by plain semantics but won't match
      remote-node/host on Cilium. The divergence is an overblock of node-sourced
      traffic that the author doesn't want anyway.
    evidence: []
  - id: n1
    class: node-exception-segment
    subject: {kind: Namespace, namespace: saas-tenant-acme, name: saas-tenant-acme}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      No hostNetwork workloads, no DaemonSets. Tenants share general nodes only with
      each other's pods (all on the pod network) and system components. Same for
      globex and initech.
    evidence: []
  - id: n2
    class: other
    subject: {kind: NetworkPolicy, namespace: saas-platform, name: mailer-egress-to-external-smtp, port: 25}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Internet egress 0.0.0.0/0 on 25/465/587 with private, CGNAT, link-local and
      loopback excepted. It can't reach pods, nodes or the lab external network.
      Intentional.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
