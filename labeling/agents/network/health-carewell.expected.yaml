scenario: health-carewell
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      NodePort (auto-allocated nodePort, ETP Local) to edge-proxy, whose ingress is
      ipBlock 0.0.0.0/0 except 192.168.0.0/16. The comment states the intent: "Pod
      CIDR excluded: in-cluster workloads must not use the public entry point as a
      pivot". Node IPs 172.18/16 are still admitted. Packet path: a pod on a non-edge
      node sends to <edge IP>:<nodePort>. Its node doesn't DNAT (dst not LOCAL).
      Calico natOutgoing masquerades it to that node's IP (dst outside the IP
      pools). The edge node DNATs to the local pod with the source kept (ETP Local).
      The policy sees a node IP, which the ipBlock admits, and the except is
      bypassed. README item 9 acknowledges node IPs are admitted but assumes pods
      are kept out; SNAT breaks that assumption. The spec: whether rewriting happens
      before or after policy is undefined.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      Same structure. On Cilium I expect the masqueraded source to be identified as
      remote-node, which a CIDR peer does not match by default, so the pod pivot is
      probably denied there. Still a fragile rule.
    evidence: []
  - id: f3
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: health-edge, name: edge-proxy, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      By plain semantics 0.0.0.0/0 except pod CIDR admits node IPs; README item 9 even
      treats that as intended ("any host-network process can reach the public proxy").
      On Cilium node-sourced traffic (remote-node/host) is not matched by CIDR peers,
      so it's denied: an overblock that's harmless for intent.
    evidence: []
  - id: n1
    class: node-exception-segment
    subject: {kind: Namespace, namespace: health-phi, name: health-phi}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      log-shipper (tolerates everything) and backup-agent (restricted pool) share
      nodes with PHI, but neither is hostNetwork. They are ordinary pods under
      health-ops default-deny, and no PHI policy admits them. README gap 1 describes
      a hypothetical other team's hostNetwork pod, which isn't present here. Same
      for health-reporting.
    evidence: []
  - id: n2
    class: other
    subject: {kind: NetworkPolicy, namespace: health-notify, name: notifications, port: 443}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Broad internet egress 0.0.0.0/0:443,587 with RFC1918/CGNAT/link-local/loopback
      excepted. It can't reach pods, nodes or the lab external network. Intentional
      (README item 6). The log-shipper/backup-agent /32 and /24 TEST-NET egress
      rules are likewise fine.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
