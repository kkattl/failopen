scenario: ecommerce-northwind-overlap
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [calico]
    label: must
    severity: warning
    rationale: >
      edge-proxy is a NodePort backend (30080, ETP Local), and its only ingress
      source is ipBlock 172.18.0.0/16. That is the node network, and it doesn't
      include the pod CIDR. Packet path on Calico: a pod on node A (without egress
      restrictions, i.e. any non-ecom namespace) connects to <edge IP>:30080. Node A
      does not DNAT it (the NodePort rules only fire for dst-type LOCAL). Calico
      natOutgoing MASQUERADEs it to node A's IP because the destination is outside
      every IP pool. On the edge node kube-proxy DNATs it to the local edge-proxy
      pod with the source kept (ETP Local), and the policy sees src = 172.18.x.x,
      which the ipBlock admits. Pods therefore reach a tier that should only take
      traffic from the F5. The spec leaves it undefined whether SNAT happens before
      or after policy. Only pods on the edge node itself keep their pod IP and stay
      denied.
    evidence: []
  - id: f2
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: ecom-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [cilium]
    label: may
    severity: warning
    rationale: >
      Structurally the same misconfiguration. On Cilium I expect the masqueraded
      source (node A IP) to arrive with the remote-node identity, and by default
      Cilium CIDR peers don't match remote-node, so no bypass is measured (see f3).
      Reporting it is still reasonable because the rule is fragile (e.g.
      policy-cidr-match-mode=nodes would open it).
    evidence: []
  - id: f3
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: ecom-edge, name: edge-proxy-ingress-from-f5, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      The ipBlock is exactly the node range. By plain semantics it admits
      node-sourced traffic (hostNetwork processes on any node reaching the NodePort).
      On Cilium CIDR rules apply to world only, so those are denied. The author meant
      "the F5 SNAT pool", which in the lab happens to be the node network. Arguable
      whether that counts as "meant to cover node addresses".
    evidence: []
  - id: ec-nes
    class: node-exception-segment
    subject: {kind: Namespace, namespace: ecom-orders, name: ecom-orders}
    mechanism: node-local
    applies_to_cni: [any]
    label: must-not
    rationale: >
      No hostNetwork workloads at all. checkout/orders-db on the restricted nodes share
      them only with system hostNetwork components (kubelet, kube-proxy, CNI agent),
      which the class excludes.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
