scenario: fintech-paylane-hostnet-agent
labeler: agent-network
labeled_at: 2026-09-24
blind: true

findings:
  - id: f1
    class: hostnetwork-under-policy
    subject: {kind: Workload, namespace: fintech-ops, name: node-agent, port: 9100}
    mechanism: hostnetwork
    applies_to_cni: [any]
    label: must
    severity: warning
    rationale: >
      fintech-ops/node-agent (DaemonSet, hostNetwork: true after the mutation) is
      selected by fintech-ops/default-deny-all, allow-dns-egress and node-agent. The
      node-agent policy says "ingress only from prometheus on 9100, egress only
      443 to non-private". For a hostNetwork pod the spec leaves this undefined. On
      Calico/Cilium the listeners :9100 (node-exporter) and :2020 (fluent-bit) are
      bound on every node IP, including the internet-facing edge node, and are
      reachable from any pod, node or the external 10.250.0.0/24 network. The agent's
      own egress is also unrestricted (kubelet 10250, apiserver, every node).
    evidence: []
  - id: f2
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-cde, name: fintech-cde}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: must
    severity: critical
    rationale: >
      node-agent tolerates every taint (operator: Exists), so a non-system
      hostNetwork pod now runs on each restricted node next to payments-core,
      card-gateway, ledger and postgres. Node-local traffic is always allowed
      (docs; Calico does not police host->local WEP; Cilium allows reserved:host by
      default), so the agent's processes reach postgres:5432, ledger:8080 and others
      on the same node despite the CDE default-deny. The original README (gap 1)
      verified exactly this with a test hostNetwork pod. The PCI CDE boundary now
      contains a third-party agent.
    evidence: []
  - id: f3
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-app, name: fintech-app}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: may
    severity: warning
    rationale: >
      Same mechanism as f2 on the general nodes (checkout-api, redis:6379,
      admin-panel). The fix is the same as f2 (drop hostNetwork from node-agent), so
      a tool may report it once per agent instead of once per namespace.
    evidence: []
  - id: f4
    class: node-exception-segment
    subject: {kind: Namespace, namespace: fintech-edge, name: fintech-edge}
    mechanism: node-local
    applies_to_cni: [calico, cilium]
    label: may
    severity: info
    rationale: >
      Same mechanism on the edge node (edge-proxy). edge-proxy already admits
      0.0.0.0/0 on 8080, so the only extra exposure is to other ports. Low value.
    evidence: []
  - id: f5
    class: other
    subject: {kind: NetworkPolicy, namespace: fintech-ops, name: prometheus, port: 9100}
    mechanism: hostnetwork
    applies_to_cni: [calico, cilium]
    label: may
    severity: warning
    rationale: >
      Overblock, the other side of f1: prometheus egress allows podSelector
      app=node-agent:9100, but the node-agent pods now have node IPs. Calico
      selectors match workload endpoints, not host IPs; Cilium sees
      reserved:host/remote-node, not the pod's labels. So the declared flow 11 is
      probably dropped by prometheus's own egress policy (undefined per spec). A
      human would fix this, but it may be folded into f1.
    evidence: []
  - id: fp-edge-ipblock
    class: ipblock-admits-node-ips
    subject: {kind: Service, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: snat
    applies_to_cni: [any]
    label: must-not
    rationale: >
      NodePort 30880 (ETP Local) in front of edge-proxy, whose ingress ipBlock is
      0.0.0.0/0 with no except. It admits node IPs, but it admits pod IPs too, so a
      pod SNAT'd to its node IP (Calico natOutgoing on pod->edge-node-IP:30880) gains
      nothing it did not already have. The README's own example of a broad 0.0.0.0/0
      that already admits pods on purpose.
    evidence: []
  - id: fp-edge-cilium
    class: cilium-ipblock-cluster-addrs
    subject: {kind: NetworkPolicy, namespace: fintech-edge, name: edge-proxy, port: 8080}
    mechanism: cni
    applies_to_cni: [cilium]
    label: may
    severity: info
    rationale: >
      On Cilium a CIDR peer (even 0.0.0.0/0) matches only the "world" identity, not
      pods, reserved:host or remote-node. Plain-spec semantics say 0.0.0.0/0 admits
      in-cluster pods and node-sourced traffic, so on Cilium those are denied (an
      overblock). The designer only meant "internet via the LB", so it doesn't break
      intent. Hence may/info.
    evidence: []
  - id: fp-egress-except
    class: other
    subject: {kind: NetworkPolicy, namespace: fintech-cde, name: card-gateway, port: 443}
    mechanism: other
    applies_to_cni: [any]
    label: must-not
    rationale: >
      Egress 0.0.0.0/0:443 with except RFC1918/CGNAT/link-local/loopback excludes the
      pod CIDR (192.168/16), node IPs (172.18/16 within 172.16/12) and the external
      lab network (10/8). It can't reach anything in the cluster. Same for
      fintech-ops/node-agent's egress rule. Not a finding.
    evidence: []
  - id: cni-flannel
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [flannel]
    label: must
    severity: critical
    rationale: >
      NetworkPolicies exist in this scenario but flannel has no policy engine;
      the API server accepts NetworkPolicy objects regardless ("Posting
      NetworkPolicy to the API server will have no effect unless your chosen
      networking solution supports network policy"). Every declared deny is open.
    evidence: []
  - id: cni-enforcing
    class: cni-not-enforcing
    subject: {kind: Cluster}
    mechanism: cni
    applies_to_cni: [calico, cilium]
    label: must-not
    rationale: >
      Calico and Cilium both implement networking.k8s.io/v1 NetworkPolicy.
    evidence: []
