apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
# Default-deny: nothing may talk to pods in this namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payments
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The "protected" service the policy is supposed to isolate.
apiVersion: v1
kind: Pod
metadata:
  name: api-server
  namespace: payments
  labels:
    app: api-server
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.9
---
# HOLE #1: hostNetwork pod — lives on the node's network,
# so the NetworkPolicy above simply does not apply to it.
apiVersion: v1
kind: Pod
metadata:
  name: host-probe
  namespace: payments
  labels:
    app: host-probe
spec:
  hostNetwork: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.9
---
# HOLE #2: NodePort exposes a payments pod on every node's IP,
# bypassing namespace isolation from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: api-nodeport
  namespace: payments
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31080
