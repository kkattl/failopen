# Throwaway manifests for verifying which "holes" are real on a given CNI.
# Not part of the scenario: applied/removed by hack/demo/verify/verify.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: verify-client
---
# Ordinary pod in another namespace: the "attacker inside the cluster".
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: verify-client
spec:
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
---
# hostPort candidate: payments pod (covered by default-deny-all) exposed
# via hostPort 30081 on its node.
apiVersion: v1
kind: Pod
metadata:
  name: hostport-probe
  namespace: payments
spec:
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=80"]
      ports:
        - containerPort: 80
          hostPort: 30081
